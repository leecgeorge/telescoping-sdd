name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the supported floor (3.9 is end-of-life and absent from current
        # ubuntu-latest images); 3.12 and 3.13 are current releases.
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install pytest -r telescoping-sdd/skills/project-blueprint/scripts/requirements.txt
      - name: Run test suite
        run: pytest telescoping-sdd/ -q
